<header class="site-header">
  <div class="header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Yue Zhou, home">
      <span class="site-brand__name">Yue Zhou</span>
      <span class="site-brand__name-zh" lang="zh-CN">周越</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" data-nav-toggle>
      <span class="sr-only">Open navigation</span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
    </button>

    <nav id="primary-navigation" class="site-nav" aria-label="Primary navigation" data-site-nav>
      <ul class="site-nav__list">
        {% for link in site.data.navigation.main %}
          {% assign link_url = link.url | relative_url %}
          <li class="site-nav__item">
            <a class="site-nav__link{% if page.url == link.url %} is-active{% endif %}"
               href="{{ link_url }}"
               {% if page.url == link.url %}aria-current="page"{% endif %}>{{ link.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
