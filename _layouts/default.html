<!doctype html>
<html lang="{{ page.lang | default: site.locale | default: 'en' | slice: 0, 2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="page-{{ page.page_key | default: 'default' }}">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {% include masthead.html %}

    <main class="site-shell">
      {% include sidebar.html %}

      <article id="main-content" class="site-main page" tabindex="-1" itemscope itemtype="https://schema.org/WebPage">
        {% if page.title %}
          <meta itemprop="name" content="{{ page.title | strip_html | strip_newlines | escape }}">
        {% endif %}
        <div class="page__inner-wrap">
          <div class="page__content" itemprop="mainContentOfPage">
            {{ content }}
          </div>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>&copy; {{ 'now' | date: '%Y' }} Yue Zhou. Built with Jekyll and hosted on GitHub Pages.</p>
      </div>
    </footer>

    {% include scripts.html %}
  </body>
</html>
